# ==============================================================================
# 🐳 RENTAL HUB — PRODUCTION DOCKER ORCHESTRATION CONFIGURATION (docker-compose.yml)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 🗄️ PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: rentalhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Named persistent volume to protect data against container destructions
      - postgres_data:/var/lib/postgresql/data
      # Mount relational schema into auto-execution folder on initial run
      - ./database_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rental_net
    healthcheck:
      # Verifies PG is operational and receiving connections before Express boots
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 🔙 Express.js Layered REST API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentalhub_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PORT}:${PORT}"
    networks:
      - rental_net
    depends_on:
      db:
        # Blocks boot until PG database is healthy and ready to receive query handshakes
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 🚀 Next.js React 19 Frontend Dashboard Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passes environment variable at build-time to bake into static client bundle
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: rentalhub_frontend
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT}
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    networks:
      - rental_net
    depends_on:
      - backend

# ------------------------------------------------------------------------------
# 📦 NETWORK & VOLUME DEFINITIONS
# ------------------------------------------------------------------------------
volumes:
  # Persistent Named Volume for Postgres DB
  postgres_data:
    driver: local

networks:
  # Isolated shared bridge network for container-to-container interactions
  rental_net:
    driver: bridge
